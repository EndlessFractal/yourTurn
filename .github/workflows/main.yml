name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/module.json
      DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Substitute Manifest and Download Links
        run: |
          sed -i \
            -e "s|\${version}|${VERSION}|g" \
            -e "s|\${manifest}|${MANIFEST_URL}|g" \
            -e "s|\${download}|${DOWNLOAD_URL}|g" \
            module.json

      - name: Create Module Archive
        run: zip -r ./module.zip *

      - name: Update Versioned Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          files: |
            ./module.json
            ./module.zip

      - name: Update Latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          body: ${{ github.event.release.body }}
          files: |
            ./module.json
            ./module.zip

      - name: Publish to Foundry VTT
        run: |
          MINIMUM=$(jq -r '.compatibility.minimum' module.json)
          VERIFIED=$(jq -r '.compatibility.verified' module.json)
          
          curl -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H 'Content-Type: application/json' \
            -H 'Authorization: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}' \
            -d '{
              "id": "your-turn",
              "release": {
                "version": "'${VERSION}'",
                "manifest": "https://github.com/'${REPO}'/releases/download/'${VERSION}'/module.json",
                "notes": "https://github.com/'${REPO}'/releases/tag/'${VERSION}'",
                "compatibility": {
                  "minimum": "'$MINIMUM'",
                  "verified": "'$VERIFIED'",
                  "maximum": ""
                }
              }
            }'
